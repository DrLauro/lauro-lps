# Produção: build sem SITE/BASE (lauro.adv.br) publicado no Worker lauro-adv-br (wrangler.jsonc).
name: Deploy produção (Cloudflare)
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild diário para atualizar a nota e o total de avaliações do Google (src/lib/avaliacoes.mjs).
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          PUBLIC_ENV: production
          # ID do contêiner do GTM (variável do repositório). Vazio = site sem GTM e sem banner de cookies.
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          # Chave da Places API (New), restrita a essa API. Sem ela a faixa mostra só "Avaliações no Google".
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      - run: npm run check:dist
      - run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 00728a10caf986579afe02eafff98ab8
